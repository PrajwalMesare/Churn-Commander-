# ⚡ OPTIMIZED FOR FAST DEPLOYMENT

[client]
showErrorDetails = false
showWarnings = false
toolbarMode = "minimal"

[logger]
level = "error"

[server]
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = false
headless = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[theme]
primaryColor = "#667eea"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[cache]
# Optimize caching
maxMegabytes = 500
